name: Release

# Publishes a GitHub release for each version tag with the OpenAPI contract attached; the web
# repository pins that release to generate its API types.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the contract version
        run: |
          version="$(node -p "require('./package.json').version")"
          contract="$(node -p "require('./docs/openapi.json').info.version")"
          echo "Tag ${GITHUB_REF_NAME}, package ${version}, contract ${contract}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${contract}" = "${version}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" docs/openapi.json \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
